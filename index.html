    <!-- Mobile UI & PWA Capabilities -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="RoomSplit" />

    <style>
      html, body, #root {
        height: 100%;
        margin: 0;
      }
      .launch-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        padding: 24px;
        color: #f8fafc;
        text-align: center;
        font-family: system-ui, -apple-system, sans-serif;
        background: #0f172a;
      }
      .launch-screen__logo {
        width: 72px;
        height: 72px;
        object-fit: contain;
      }
      .launch-screen__logo-frame {
        display: grid;
        place-items: center;
        padding: 10px;
        border-radius: 16px;
        background: #ffffff;
        box-shadow: 0 10px 25px rgb(0 0 0 / 25%);
      }
      .launch-screen__title {
        margin: 18px 0 0;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .launch-screen__subtitle {
        margin: 6px 0 0;
        color: #94a3b8;
        font-size: 13px;
      }
      .launch-screen__spinner {
        width: 22px;
        height: 22px;
        margin-top: 24px;
        border: 2.5px solid rgb(255 255 255 / 20%);
        border-top-color: #10b981;
        border-radius: 50%;
        animation: launch-spin 0.8s linear infinite;
      }
      @keyframes launch-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .launch-screen__spinner {
          animation: none;
        }
      }
    </style>

    <link rel="icon" type="image/png" sizes="192x192" href="/roomsplit-icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/roomsplit-icon-192.png" />
  </head>
  <body class="bg-[#F8FAFC] font-sans antialiased text-slate-900 selection:bg-slate-900 selection:text-white">
    <div id="root">
      <main class="launch-screen" aria-label="RoomSplit sign in">
        <div class="launch-screen__logo-frame">
          <img class="launch-screen__logo" src="/roomsplit-icon.webp" alt="" />
        </div>
        <h1 class="launch-screen__title">RoomSplit</h1>
        <p class="launch-screen__subtitle">Shared expenses, simplified.</p>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

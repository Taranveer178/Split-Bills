    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "RoomSplit",
        "url": "https://split-bills.taranveer.in/",
        "description": "Split bills with roommates, track shared flat expenses, and organize rent, utilities, groceries, and UPI or cash settlements.",
        "applicationCategory": "FinanceApplication",

      }
    </script>

    <!-- Mobile UI & PWA Capabilities -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="RoomSplit" />

    <script>
      try {
        if (localStorage.getItem('rs_theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch {
        // Keep the default light appearance when storage is unavailable.
      }
    </script>

    <style>
      html, body, #root {
        height: 100%;
        margin: 0;
      }
      .launch-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        padding: 24px;
        color: #0f172a;
        text-align: center;
        font-family: system-ui, -apple-system, sans-serif;
        background: #ffffff;
      }
      .launch-screen__logo-frame {
        display: grid;
        place-items: center;
        width: 96px;
        height: 96px;
        overflow: hidden;
        border: 1px solid rgb(226 232 240 / 85%);
        border-radius: 24px;
        background: #ffffff;
        box-shadow: 0 18px 40px rgb(15 23 42 / 8%), 0 4px 12px rgb(15 23 42 / 5%);
      }
      .launch-screen__logo {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        object-fit: cover;
        transform: scale(1.08);
      }
      .launch-screen__title {
        margin: 20px 0 0;
        font-size: 24px;
        font-weight: 750;
        letter-spacing: -0.04em;
      }
      .launch-screen__subtitle {
        margin: 7px 0 0;
        color: #64748b;
        font-size: 13px;
        letter-spacing: 0.01em;
      }
      .launch-screen__spinner {
        width: 24px;
        height: 24px;
        margin-top: 28px;
        border: 2.5px solid rgb(148 163 184 / 20%);
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: launch-spin 0.8s linear infinite;
      }
      @keyframes launch-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .launch-screen__spinner {
          animation: none;
        }
      }
    </style>

    <link rel="icon" type="image/png" sizes="192x192" href="/roomsplit-icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/roomsplit-icon-192.png" />
  </head>
  <body class="bg-white font-sans antialiased text-slate-900 selection:bg-slate-900 selection:text-white">
    <div id="root">
      <main class="launch-screen" role="status" aria-label="Loading RoomSplit">
        <div class="launch-screen__logo-frame">
          <img class="launch-screen__logo" src="/roomsplit-icon-192.png" alt="" />
        </div>
        <h1 class="launch-screen__title">RoomSplit</h1>
        <p class="launch-screen__subtitle">Shared expenses, simplified.</p>
        <span class="launch-screen__spinner" aria-hidden="true"></span>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

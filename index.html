<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />

    <!-- Primary SEO Meta Tags -->
    <title>RoomSplit — Shared Expense & Bill Ledger</title>
    <meta name="title" content="RoomSplit — Shared Expense & Bill Ledger" />
    <meta name="description" content="Track flat expenses, split UPI & cash bills, manage roommate balances, and calculate settlements with custom and equal split calculations." />
    <meta name="keywords" content=" Bill split, Room Split, splitwise, splitwise taranveer, expense splitter, roommate bill split, hisaab manager, shared expenses, splitwise alternative, track flat rent, UPI bill split" />
    <meta name="author" content="RoomSplit" />
    <meta name="robots" content="index, follow" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <link rel="ard" type="application/json" href="/.well-known/ard.json" />
    <link rel="ai-catalog" type="application/json" href="/ai-catalog.json" />

    <!-- Open Graph / Facebook / WhatsApp Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://split-bills.taranveer.in/" />
    <meta property="og:title" content="RoomSplit — Shared Expense & Bill Ledger" />
    <meta property="og:description" content="Easily track who paid, split bills equally or unequally, and settle balances." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?auto=format&fit=crop&w=1200&h=630&q=80" />

    <!-- Twitter Card Preview -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://split-bills.taranveer.in/" />
    <meta property="twitter:title" content="RoomSplit — Shared Expense & Bill Ledger" />
    <meta property="twitter:description" content="Split bills, manage roommate debt, and settle UPI or cash payments." />
    <meta property="twitter:image" content="https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?auto=format&fit=crop&w=1200&h=630&q=80" />

    <!-- Mobile UI & PWA Capabilities -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="RoomSplit" />

    <script>
      try {
        if (localStorage.getItem('rs_theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch {
        // Keep the default light appearance when storage is unavailable.
      }
    </script>

    <style>
      html, body, #root {
        height: 100%;
        margin: 0;
      }
      .launch-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        padding: 24px;
        color: #0f172a;
        text-align: center;
        font-family: system-ui, -apple-system, sans-serif;
        background:
          radial-gradient(ellipse at 50% 42%, rgb(99 102 241 / 9%), transparent 42%),
          radial-gradient(ellipse at 15% 85%, rgb(16 185 129 / 7%), transparent 35%),
          #f8fafc;
      }
      .launch-screen__logo-frame {
        display: grid;
        place-items: center;
        width: 96px;
        height: 96px;
        overflow: hidden;
        border: 1px solid rgb(226 232 240 / 85%);
        border-radius: 24px;
        background: #ffffff;
        box-shadow: 0 18px 40px rgb(79 70 229 / 14%), 0 4px 12px rgb(15 23 42 / 6%);
      }
      .launch-screen__logo {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        object-fit: cover;
        transform: scale(1.08);
      }
      .launch-screen__title {
        margin: 20px 0 0;
        font-size: 24px;
        font-weight: 750;
        letter-spacing: -0.04em;
      }
      .launch-screen__subtitle {
        margin: 7px 0 0;
        color: #64748b;
        font-size: 13px;
        letter-spacing: 0.01em;
      }
      .launch-screen__spinner {
        width: 24px;
        height: 24px;
        margin-top: 28px;
        border: 2.5px solid rgb(79 70 229 / 15%);
        border-top-color: #4f46e5;
        border-radius: 50%;
        animation: launch-spin 0.8s linear infinite;
      }
      @keyframes launch-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .launch-screen__spinner {
          animation: none;
        }
      }
    </style>

    <link rel="icon" type="image/png" sizes="192x192" href="/roomsplit-icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/roomsplit-icon-192.png" />
  </head>
  <body class="bg-[#F8FAFC] font-sans antialiased text-slate-900 selection:bg-slate-900 selection:text-white">
    <div id="root">
      <main class="launch-screen" role="status" aria-label="Loading RoomSplit">
        <div class="launch-screen__logo-frame">
          <img class="launch-screen__logo" src="/roomsplit-icon-192.png" alt="" />
        </div>
        <h1 class="launch-screen__title">RoomSplit</h1>
        <p class="launch-screen__subtitle">Shared expenses, simplified.</p>
        <span class="launch-screen__spinner" aria-hidden="true"></span>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
